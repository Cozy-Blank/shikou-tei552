<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kimetelu - モーニングラテ・リーダー</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        latteBg: '#FDFBF7',
                        latteCard: '#FFFFFF',
                        latteMain: '#B58863',
                        latteAccent: '#FF6F59',
                        latteText: '#4A3B32',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-latteBg text-latteText min-h-screen font-sans pb-12">

    <!-- ヘッダー -->
    <header class="bg-latteCard border-b border-[#EFECE6] sticky top-0 z-10 shadow-sm">
        <div class="max-w-xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                ☕ kimetelu
            </h1>
            <span class="text-xs bg-[#F3ECE4] text-latteMain px-2.5 py-1 rounded-full font-medium">モーニングラテ</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">

        <!-- 登録セクション -->
        <section class="bg-latteCard p-5 rounded-2xl shadow-sm border border-[#EFECE6]">
            <h2 class="text-sm font-bold text-latteMain mb-3">＋ お気に入りを追加する</h2>
            <div class="space-y-3">
                <input type="text" id="siteTitle" placeholder="サイト名（例：〇〇さんのブログ）" class="w-full px-4 py-2 text-sm bg-latteBg border border-[#EFECE6] rounded-xl focus:outline-none focus:border-latteMain">
                <input type="url" id="siteUrl" placeholder="URL（例：https://example.com）" class="w-full px-4 py-2 text-sm bg-latteBg border border-[#EFECE6] rounded-xl focus:outline-none focus:border-latteMain">
                <button onclick="addSource()" class="w-full bg-latteAccent text-white font-bold py-2.5 rounded-xl text-sm shadow-sm hover:opacity-90 transition">
                    リストに登録する
                </button>
            </div>
        </section>

        <!-- タイムラインセクション -->
        <section>
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-base">タイムライン</h2>
                <button onclick="loadTimeline()" class="text-xs text-latteMain underline hover:opacity-80">更新を確認する</button>
            </div>

            <div id="timelineList" class="space-y-4">
                <!-- サンプル記事 -->
                <article class="bg-latteCard p-4 rounded-2xl shadow-sm border border-[#EFECE6]">
                    <div class="flex items-center justify-between text-xs text-gray-400 mb-1">
                        <span class="font-medium text-latteMain">kimetelu 公式案内</span>
                        <span>今日 08:00</span>
                    </div>
                    <h3 class="font-bold text-base mb-1">
                        <a href="#" class="hover:text-latteAccent">ダラダラ見を防ぐ！自分だけの情報空間を作ろう</a>
                    </h3>
                    <p class="text-xs text-gray-500">
                        お気に入りのソースだけをここに登録して、情報の沼から抜け出しましょう！
                    </p>
                </article>
            </div>
        </section>

    </main>

    <script>
        let sources = JSON.parse(localStorage.getItem('kimetelu_sources')) || [];

        function addSource() {
            const title = document.getElementById('siteTitle').value;
            const url = document.getElementById('siteUrl').value;

            if (!title || !url) {
                alert('サイト名とURLを入力してね！');
                return;
            }

            sources.push({ title, url });
            localStorage.setItem('kimetelu_sources', JSON.stringify(sources));

            document.getElementById('siteTitle').value = '';
            document.getElementById('siteUrl').value = '';
            
            alert('お気に入りに登録したよ！');
            loadTimeline();
        }

        function loadTimeline() {
            const timelineList = document.getElementById('timelineList');
            let html = `
                <article class="bg-latteCard p-4 rounded-2xl shadow-sm border border-[#EFECE6]">
                    <div class="flex items-center justify-between text-xs text-gray-400 mb-1">
                        <span class="font-medium text-latteMain">kimetelu 公式案内</span>
                        <span>今日 08:00</span>
                    </div>
                    <h3 class="font-bold text-base mb-1">
                        <a href="#" class="hover:text-latteAccent">ダラダラ見を防ぐ！自分だけの情報空間を作ろう</a>
                    </h3>
                    <p class="text-xs text-gray-500">
                        お気に入りのソースだけをここに登録して、情報の沼から抜け出しましょう！
                    </p>
                </article>
            `;

            if (sources.length > 0) {
                sources.forEach(src => {
                    html += `
                        <article class="bg-latteCard p-4 rounded-2xl shadow-sm border border-[#EFECE6]">
                            <div class="flex items-center justify-between text-xs text-gray-400 mb-1">
                                <span class="font-medium text-latteMain">${src.title}</span>
                                <span class="text-latteAccent font-bold">New</span>
                            </div>
                            <h3 class="font-bold text-base mb-1">
                                <a href="${src.url}" target="_blank" class="hover:text-latteAccent">${src.title} のページを開く</a>
                            </h3>
                            <p class="text-xs text-gray-500">
                                登録URL: ${src.url}
                            </p>
                        </article>
                    `;
                });
            }

            timelineList.innerHTML = html;
        }

        loadTimeline();
    </script>
</body>
</html>
