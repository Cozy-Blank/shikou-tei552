<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kimetelu - ダダラ見を防ぐ情報空間</title>
    <style>
        :root {
            --bg-color: #fbf9f6;
            --card-bg: #ffffff;
            --text-main: #2c221e;
            --text-sub: #7a6e65;
            --accent-coral: #ff7f6b;
            --accent-gold: #e6b800; /* ③サンセットゴールド */
            --border-color: #f0eae1;
            --tag-bg: #f3efe6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        .theme-badge {
            background-color: var(--tag-bg);
            color: var(--text-sub);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        .btn-primary {
            background-color: var(--accent-coral);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .refresh-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            text-decoration: underline;
        }

        .article-item {
            display: block;
            text-decoration: none;
            color: inherit;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: transform 0.1s ease;
        }

        .article-item:hover {
            border-color: var(--accent-coral);
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .article-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .article-desc {
            font-size: 13px;
            color: var(--text-sub);
        }

        /* サンセットゴールドのNEWバッジ */
        .new-badge {
            background-color: var(--accent-gold);
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <span>☕</span> kimetelu
            </div>
            <div class="theme-badge">モーニングラテ</div>
        </header>

        <!-- お気に入り追加エリア -->
        <div class="card">
            <div style="font-weight: bold; margin-bottom: 12px; font-size: 14px; color: var(--text-sub);">+ お気に入りを追加する</div>
            <input type="text" id="siteName" placeholder="サイト名（例：〇〇さんのブログ）">
            <input type="url" id="siteUrl" placeholder="URL（例：https://example.com）">
            <button class="btn-primary" onclick="addSite()">リストに登録する</button>
        </div>

        <!-- タイムラインエリア -->
        <div>
            <div class="timeline-header">
                <span>タイムライン</span>
                <button class="refresh-btn" onclick="checkUpdates()">更新を確認する</button>
            </div>
            <div id="timelineList">
                <!-- タイムラインの記事がここに表示されます -->
            </div>
        </div>
    </div>

    <script>
        // サンプルの初期記事データ
        let articles = [
            {
                id: "art-1",
                site: "kimetelu 公式案内",
                title: "ダダラ見を防ぐ！自分だけの情報空間を作ろう",
                desc: "お気に入りのソースだけに登録して、情報の沼から抜け出しましょう！",
                time: "今日 08:00",
                url: "#"
            }
        ];

        // ページを読み込んだときと、更新ボタンを押したときに一覧を表示する
        function renderTimeline() {
            const listContainer = document.getElementById("timelineList");
            listContainer.innerHTML = "";

            // すでにクリックして既読にした記事のIDをブラウザの記憶から取得する
            const readArticles = JSON.parse(localStorage.getItem("readArticles") || "[]");

            articles.forEach(article => {
                // まだ読んでいない（既読リストに含まれていない）場合だけ isNew を true にする
                const isNew = !readArticles.includes(article.id);

                const item = document.createElement("a");
                item.href = article.url;
                item.className = "article-item";
                // 記事をクリックしたときに「読んだよ」と記憶してNEWを消す関数を呼ぶ
                item.onclick = function() {
                    markAsRead(article.id);
                };

                item.innerHTML = `
                    <div class="article-meta">
                        <span>${article.site}</span>
                        <span>${article.time}</span>
                    </div>
                    <div class="article-title">
                        ${article.title}
                        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                    </div>
                    <div class="article-desc">${article.desc}</div>
                `;
                listContainer.appendChild(item);
            });
        }

        // 記事をクリックしたときに既読にする関数
        function markAsRead(id) {
            let readArticles = JSON.parse(localStorage.getItem("readArticles") || "[]");
            if (!readArticles.includes(id)) {
                readArticles.push(id);
                localStorage.setItem("readArticles", JSON.stringify(readArticles));
            }
        }

        // 「更新を確認する」ボタンを押したときの処理
        function checkUpdates() {
            // ここで本当は最新情報を取得しにいく動きをシミュレーション
            renderTimeline();
            alert("最新の更新を確認しました！");
        }

        // サイト登録機能（簡易版）
        function addSite() {
            const name = document.getElementById("siteName").value;
            const url = document.getElementById("siteUrl").value;
            if(!name || !url) {
                alert("サイト名とURLを入力してくださいね！");
                return;
            }

            // 新しい記事データを追加（新しいものなので自動でNEWがつくよ！）
            const newArticle = {
                id: "art-" + Date.now(),
                site: name,
                title: name + " の新着記事",
                desc: "登録された新しい情報ソースです。",
                time: "たった今",
                url: url
            };

            articles.unshift(newArticle); // リストの先頭に追加
            renderTimeline();

            // 入力欄を空にする
            document.getElementById("siteName").value = "";
            document.getElementById("siteUrl").value = "";
            alert("お気に入りに追加しました！");
        }

        // 最初の一回目を表示
        renderTimeline();
    </script>
</body>
</html>
